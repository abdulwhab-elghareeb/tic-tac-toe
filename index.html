<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="result-container">
            <div class="result"></div>
            <button class="reset">Reset</button>
        </div> 

        <div class="player1">
            <input type="text" name="player1-name" id="player1-name" maxlength="15" minlength="2" readonly> 
            <div><button><label for="player1-name">Change name</label></button></div>
            <div class="marker markerX">X</div>
        </div>

        <div class="game-grid"></div>

        <div class="player2">
            <input type="text" name="player2-name" id="player2-name" maxlength="15" minlength="2" readonly>
            <div><button><label for="player2-name">Change name</label></button></div> 
            <div class="marker markerO">O</div>
        </div>

    </div>

    </div>
</body>
</html>
